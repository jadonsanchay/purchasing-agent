# Eval cases. One per scenario fixture. Each case states what a correct run looks like along the six
# questions from the brief: decision correct, information obtained, constraints respected, appropriate
# action, validated, and behaviour when the first action does not work.
#
# Fields
#   expected_actions     acceptable final decision actions
#   expected_qty         acceptable final ordered quantity on a NEW po (min/max), when a new PO is expected
#   required_tools       tools that must have been called before the first proposal (evidence gathering)
#   expected_kinds       executed ERP action kinds that must appear (successful ones)
#   forbidden_kinds      executed action kinds that must NOT appear as successful
#   expected_status      acceptable terminal run status
#   auto_approve         harness approves when the run pauses for a human
#   expect_recovery      whether the run should have needed at least one recovery turn
#   final                checks on the post-run ERP state
#     inbound            min/max expected-inbound units for the SKU at the node
#     po_status          expected status of named POs
#     budget_headroom_min / storage_free_min

- id: S1-a
  scenario: S1-a
  sku: SKU-COLA-2L
  node_id: N-BOG
  expected_actions: [accept]
  expected_qty: {min: 800, max: 800}
  required_tools: [compute_coverage, check_constraints]
  expected_kinds: [create_po]
  expected_status: [completed]
  auto_approve: true
  expect_recovery: false
  final: {inbound: {min: 800, max: 800}, budget_headroom_min: 0, storage_free_min: 0}

